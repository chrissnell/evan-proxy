apiVersion: v1
kind: Service
metadata:
  name: {{ include "evan-proxy.fullname" . }}
  labels:
    {{- include "evan-proxy.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  ports:
    - name: proxy-plain
      port: {{ .Values.service.plainPort }}
      targetPort: proxy-plain
      protocol: TCP
    {{- if .Values.tls.enabled }}
    - name: proxy-tls
      port: {{ .Values.service.tlsPort }}
      targetPort: proxy-tls
      protocol: TCP
    {{- end }}
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "evan-proxy.selectorLabels" . | nindent 4 }}
