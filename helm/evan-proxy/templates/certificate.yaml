{{- if and .Values.tls.enabled .Values.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "evan-proxy.fullname" . }}
  labels:
    {{- include "evan-proxy.labels" . | nindent 4 }}
spec:
  secretName: {{ include "evan-proxy.tlsSecretName" . }}
  issuerRef:
    name: {{ .Values.tls.certManager.issuer }}
    kind: {{ .Values.tls.certManager.issuerKind }}
  dnsNames:
    - {{ .Values.tls.domain | quote }}
{{- end }}
