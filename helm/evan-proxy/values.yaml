replicaCount: 1

image:
  repository: ghcr.io/chrissnell/evan-proxy
  tag: "0.1.5"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

# Logging — console and network are independent, both can run simultaneously
logging:
  # Console output (stdout) — always active
  console:
    format: "human"    # "human" or "json"
  # Network logging — optional, runs alongside console
  net:
    mode: ""             # "json-udp" or "json-http", empty = disabled
    address: ""          # UDP: "host:port", HTTP: "http://host:port/path"
    batchSize: 100       # json-http only: max entries before flush
    flushInterval: "5s"  # json-http only: max time between flushes

# Proxy configuration
proxy:
  idleTimeout: "300s"
  httpTimeout: "30s"
  connectDialTimeout: "10s"
  authRetryTimeout: "5s"
  authFailRateLimit: 5
  authFailWindow: "60s"
  dnsServer: ""    # e.g. "1.1.1.1:53", empty = system default
  dnsProtocol: ""  # "plain", "tls", or "https" — empty = plain
  userPortMin: 8080  # start of per-user dedicated port range
  userPortMax: 8090  # end of per-user dedicated port range (11 ports)

# Persistent storage for SQLite user database
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""  # empty = default StorageClass

# Admin interface
admin:
  listen: ":9090"
  user: "admin"
  # bcrypt hash of admin password
  # generate with: htpasswd -nbBC 10 "" 'yourpassword' | cut -d: -f2
  passwordHash: "$2y$10$CHANGEME"

# Use an existing secret instead of creating one
# Secret must contain: ADMIN_USER, ADMIN_PASSWORD
existingSecret: ""

# Service
service:
  type: LoadBalancer
  # Set a specific IP from the MetalLB pool, or leave empty for auto-assign
  loadBalancerIP: ""
  annotations: {}
  adminPort: 9090

# Resources
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Network policy (requires a CNI that supports NetworkPolicy)
networkPolicy:
  enabled: true
  # Allow CONNECT tunnels to reach any port (not just 80/443)
  allowAllEgress: true

# Ingress (e.g. for admin UI via Cloudflare tunnel)
ingress:
  enabled: false
  className: cloudflare-tunnel
  annotations: {}
  hosts:
    - host: proxy.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
          servicePort: 9090

nodeSelector: {}
tolerations: []
affinity: {}
