{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "evan-proxy.fullname" . }}
  labels:
    {{- include "evan-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "evan-proxy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow proxy traffic on plain port
    - ports:
        - port: 8080
          protocol: TCP
    {{- if .Values.tls.enabled }}
    # Allow proxy traffic on TLS port
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
    # Allow admin traffic on admin port
    - ports:
        - port: 9090
          protocol: TCP
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow outbound HTTP/HTTPS (proxy forwarding)
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
    # Allow outbound to any port (CONNECT tunnels can go to any port)
    {{- if .Values.networkPolicy.allowAllEgress }}
    - {}
    {{- end }}
{{- end }}
