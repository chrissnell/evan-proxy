apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evan-proxy.fullname" . }}
  labels:
    {{- include "evan-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "evan-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "evan-proxy.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: evan-proxy
          image: "{{ .Values.image.repository }}:{{ include "evan-proxy.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "evan-proxy.fullname" . }}
          env:
            - name: PROXY_DB_PATH
              value: /data/evan-proxy/users.db
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "evan-proxy.secretName" . }}
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "evan-proxy.secretName" . }}
                  key: ADMIN_PASSWORD
          ports:
            - name: admin
              containerPort: 9090
              protocol: TCP
            {{- $min := .Values.proxy.userPortMin | int }}
            {{- $max := .Values.proxy.userPortMax | int }}
            {{- range $p := untilStep $min (add1 $max | int) 1 }}
            - name: user-{{ $p }}
              containerPort: {{ $p }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data/evan-proxy
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "evan-proxy.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
