<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>evan-proxy / admin</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1>evan-proxy</h1>
    <div class="header-controls">
      <button class="theme-toggle" id="theme-toggle" title="Toggle theme">light</button>
      <a href="#" id="logout">logout</a>
    </div>
  </div>

  <div class="box">
    <h2>proxy users</h2>
    <div id="users-error" class="error" style="display:none"></div>
    <table class="user-table" id="user-table">
      <thead><tr><th>username</th><th>created</th><th>port</th><th>dns</th><th>status</th><th></th></tr></thead>
      <tbody id="user-tbody">
        <tr><td colspan="6" class="empty">loading...</td></tr>
      </tbody>
    </table>
    <div class="user-add-form">
      <input type="text" id="new-username" placeholder="username">
      <input type="password" id="new-password" placeholder="password">
      <button id="add-user-btn">add user</button>
    </div>
  </div>

  <div class="box">
    <h2>log tail</h2>
    <div id="log-tail"></div>
  </div>

  <div class="grid-2">
    <div class="box">
      <h2>top sites &middot; 1h</h2>
      <ul class="host-list" id="top-sites">
        <li><span class="empty">waiting for data...</span></li>
      </ul>
    </div>
    <div class="box">
      <h2>dns blocked &middot; 1h</h2>
      <ul class="host-list" id="top-blocked">
        <li><span class="empty">waiting for data...</span></li>
      </ul>
    </div>
  </div>

  <div class="grid-2">
    <div class="box">
      <h2>bandwidth &middot; 10 min</h2>
      <canvas id="traffic-canvas"></canvas>
      <div class="graph-legend">
        <span class="legend-rx">in</span>
      </div>
    </div>
    <div class="box">
      <h2>requests &middot; 10 min</h2>
      <canvas id="requests-canvas"></canvas>
      <div class="graph-legend">
        <span class="legend-reqs">requests</span>
      </div>
    </div>
  </div>

</div>

<div class="footer">
  <a id="version-link" href="https://github.com/chrissnell/evan-proxy">evan-proxy</a>
</div>

<script>
// --- Theme ---
function getThemeColors() {
  var s = getComputedStyle(document.documentElement);
  return {
    graphFill: s.getPropertyValue('--graph-fill').trim(),
    graphStroke: s.getPropertyValue('--graph-stroke').trim(),
    graphTxFill: s.getPropertyValue('--graph-tx-fill').trim(),
    graphTxStroke: s.getPropertyValue('--graph-tx-stroke').trim(),
    graphReq: s.getPropertyValue('--graph-req').trim(),
    fgDim: s.getPropertyValue('--fg-dim').trim(),
  };
}

function initTheme() {
  var saved = localStorage.getItem('evan-proxy-theme');
  if (saved === 'light' || saved === 'dark') {
    document.documentElement.setAttribute('data-theme', saved);
  }
  updateThemeButton();
}

function updateThemeButton() {
  var btn = document.getElementById('theme-toggle');
  var theme = document.documentElement.getAttribute('data-theme');
  if (!theme) {
    var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    btn.textContent = isDark ? 'light' : 'dark';
  } else {
    btn.textContent = theme === 'dark' ? 'light' : 'dark';
  }
}

document.getElementById('theme-toggle').addEventListener('click', function() {
  var current = document.documentElement.getAttribute('data-theme');
  var isDarkOS = window.matchMedia('(prefers-color-scheme: dark)').matches;

  if (!current) {
    var next = isDarkOS ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('evan-proxy-theme', next);
  } else if (current === 'dark') {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('evan-proxy-theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('evan-proxy-theme', 'dark');
  }
  updateThemeButton();
  refreshTraffic();
});

initTheme();

document.getElementById('logout').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/api/logout', {method: 'POST'});
  window.location.href = '/login';
});

// --- Proxy Users ---
async function refreshUsers() {
  try {
    var resp = await fetch('/api/users');
    if (resp.status === 401) { window.location.href = '/login'; return; }
    var users = await resp.json();
    cachedUsers = users;
    deleteConfirm = null;
    renderUsers(users);
  } catch (e) { /* retry next cycle */ }
}

var editingUser = null;
var editingField = null;
var deleteConfirm = null;

function renderUsers(users) {
  var tbody = document.getElementById('user-tbody');
  if (!users || users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">no users</td></tr>';
    return;
  }
  var rows = [];
  users.forEach(function(u) {
    var created = u.created_at ? u.created_at.substring(0, 10) : '';
    var portLabel = u.port ? '<span>' + u.port + '</span>' : '<span class="dim">none</span>';
    var dnsLabel = u.dns_server ? escHtml(u.dns_protocol + '://' + u.dns_server) : '<span class="dim">default</span>';
    var esc = escAttr(u.username);
    var delBtn = deleteConfirm === u.username
      ? '<button class="btn-sm btn-danger-confirm" onclick="confirmDelete(\'' + esc + '\')">confirm?</button>'
      : '<button class="btn-sm btn-danger" onclick="startDelete(\'' + esc + '\')">delete</button>';
    var statusIndicator;
    if (!u.enabled) {
      statusIndicator = '<span class="dot dot-disabled"></span><span class="status-label status-disabled">disabled</span>';
    } else if (checkDowntimeClient(u.downtime_schedule)) {
      statusIndicator = '<span class="dot dot-downtime"></span><span class="status-label status-downtime">downtime</span>';
    } else {
      statusIndicator = '<span class="dot dot-enabled"></span><span class="status-label status-enabled">enabled</span>';
    }
    var toggleBtn = u.enabled
      ? '<button class="btn-sm btn-disabled" onclick="toggleEnabled(\'' + esc + '\',' + u.enabled + ')">disable</button>'
      : '<button class="btn-sm btn-enabled" onclick="toggleEnabled(\'' + esc + '\',' + u.enabled + ')">enable</button>';
    rows.push('<tr>' +
      '<td>' + escHtml(u.username) + '</td>' +
      '<td class="dim">' + escHtml(created) + '</td>' +
      '<td>' + portLabel + '</td>' +
      '<td>' + dnsLabel + '</td>' +
      '<td class="user-status">' + statusIndicator + '</td>' +
      '<td class="user-actions">' +
        toggleBtn +
        '<button class="btn-sm" onclick="toggleEdit(\'' + esc + '\',\'schedule\')">schedule</button>' +
        '<button class="btn-sm" onclick="toggleEdit(\'' + esc + '\',\'port\')">port</button>' +
        '<button class="btn-sm" onclick="toggleEdit(\'' + esc + '\',\'dns\')">dns</button>' +
        '<button class="btn-sm" onclick="toggleEdit(\'' + esc + '\',\'password\')">password</button>' +
        delBtn +
      '</td></tr>');
    if (editingUser === u.username) {
      if (editingField === 'schedule') rows.push(renderScheduleEditRow(u));
      else if (editingField === 'port') rows.push(renderPortEditRow(u));
      else if (editingField === 'dns') rows.push(renderDNSEditRow(u));
      else if (editingField === 'password') rows.push(renderPasswordEditRow(u));
    }
  });
  tbody.innerHTML = rows.join('');
}

async function toggleEnabled(username, currentlyEnabled) {
  showUsersError('');
  var resp = await fetch('/api/users/enabled', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: username, enabled: !currentlyEnabled})
  });
  if (resp.status === 401) { window.location.href = '/login'; return; }
  if (!resp.ok) { showUsersError('failed to toggle user'); return; }
  refreshUsers();
}

function toggleEdit(username, field) {
  deleteConfirm = null;
  if (editingUser === username && editingField === field) {
    closeEdit();
  } else {
    if (editingField === 'dns' && editingUser) delete dnsEditProto[editingUser];
    editingUser = username;
    editingField = field;
    if (field === 'dns') delete dnsEditProto[username];
  }
  refreshUsers();
}

function closeEdit() {
  if (editingField === 'dns' && editingUser) delete dnsEditProto[editingUser];
  if (editingField === 'schedule' && editingUser) delete scheduleEdit[editingUser];
  editingUser = null;
  editingField = null;
  refreshUsers();
}

function renderDNSEditRow(u) {
  if (!dnsEditProto.hasOwnProperty(u.username)) dnsEditProto[u.username] = u.dns_protocol || '';
  var proto = dnsEditProto[u.username];
  var server = u.dns_server || '';
  var esc = escAttr(u.username);
  function pbtn(val, label) {
    var cls = 'btn-sm' + (proto === val ? ' active' : '');
    return '<button class="' + cls + '" onclick="setDNSProto(\'' + esc + '\',\'' + val + '\')">' + label + '</button>';
  }
  return '<tr class="inline-edit-row">' +
    '<td colspan="6" class="inline-edit-cell">' +
      '<div class="inline-edit-form">' +
        '<span class="dns-proto-group">' +
          pbtn('', 'default') + pbtn('plain', 'plain') + pbtn('tls', 'tls') + pbtn('https', 'https') +
        '</span>' +
        '<input type="text" id="dns-server-' + esc + '" class="inline-input"' +
          ' value="' + escAttr(server) + '"' +
          ' placeholder="' + dnsPlaceholder(proto) + '"' +
          (proto === '' ? ' disabled' : '') + '>' +
        '<button class="btn-sm" onclick="testDNS(\'' + esc + '\')"' +
          (proto === '' ? ' disabled' : '') + '>test</button>' +
        '<span id="dns-result-' + esc + '"></span>' +
        '<span class="edit-actions">' +
          '<button class="btn-sm btn-save" onclick="saveDNS(\'' + esc + '\')">save</button>' +
          '<button class="btn-sm" onclick="closeEdit()">cancel</button>' +
        '</span>' +
      '</div>' +
    '</td></tr>';
}

function renderPortEditRow(u) {
  var esc = escAttr(u.username);
  return '<tr class="inline-edit-row">' +
    '<td colspan="6" class="inline-edit-cell">' +
      '<div class="inline-edit-form">' +
        '<input type="number" id="port-input-' + esc + '" class="inline-input inline-input-short"' +
          ' value="' + (u.port || '') + '" placeholder="port">' +
        '<span class="edit-actions">' +
          '<button class="btn-sm btn-save" onclick="savePort(\'' + esc + '\')">save</button>' +
          '<button class="btn-sm" onclick="closeEdit()">cancel</button>' +
        '</span>' +
      '</div>' +
    '</td></tr>';
}

function renderPasswordEditRow(u) {
  var esc = escAttr(u.username);
  return '<tr class="inline-edit-row">' +
    '<td colspan="6" class="inline-edit-cell">' +
      '<div class="inline-edit-form">' +
        '<input type="password" id="pw-input-' + esc + '" class="inline-input"' +
          ' placeholder="new password">' +
        '<span class="edit-actions">' +
          '<button class="btn-sm btn-save" onclick="savePassword(\'' + esc + '\')">save</button>' +
          '<button class="btn-sm" onclick="closeEdit()">cancel</button>' +
        '</span>' +
      '</div>' +
    '</td></tr>';
}

function dnsPlaceholder(proto) {
  if (proto === 'https') return 'https://1.1.1.1/dns-query';
  if (proto === 'tls') return '1.1.1.1:853';
  if (proto === 'plain') return '1.1.1.1:53';
  return '';
}

var dnsEditProto = {};

function setDNSProto(username, proto) {
  dnsEditProto[username] = proto;
  refreshUsers();
}

function getDNSProto(username) {
  return dnsEditProto.hasOwnProperty(username) ? dnsEditProto[username] : '';
}

async function testDNS(username) {
  var proto = getDNSProto(username);
  var server = document.getElementById('dns-server-' + username).value.trim();
  var result = document.getElementById('dns-result-' + username);
  result.innerHTML = '';

  if (!proto || !server) return;

  result.innerHTML = '<span class="dns-test-pending">...</span>';
  try {
    var resp = await fetch('/api/users/dns/test', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({dns_server: server, dns_protocol: proto})
    });
    if (resp.status === 401) { window.location.href = '/login'; return; }
    var data = await resp.json();
    if (data.ok) {
      result.innerHTML = '<span class="dns-test-ok">\u2713</span>';
    } else {
      result.innerHTML = '<span class="dns-test-fail">\u2717</span>';
    }
  } catch (e) {
    result.innerHTML = '<span class="dns-test-fail">\u2717</span>';
  }
}

function showUsersError(msg) {
  var el = document.getElementById('users-error');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

document.getElementById('add-user-btn').addEventListener('click', async function() {
  var username = document.getElementById('new-username').value.trim();
  var password = document.getElementById('new-password').value;
  showUsersError('');
  if (!username || !password) { showUsersError('username and password required'); return; }

  var resp = await fetch('/api/users', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: username, password: password})
  });
  if (resp.status === 401) { window.location.href = '/login'; return; }
  if (resp.status === 409) { showUsersError('user already exists'); return; }
  if (!resp.ok) {
    var text = await resp.text();
    showUsersError(text || 'failed to add user');
    return;
  }

  document.getElementById('new-username').value = '';
  document.getElementById('new-password').value = '';
  refreshUsers();
});

function startDelete(username) {
  deleteConfirm = username;
  renderUsersFromCache();
}

async function confirmDelete(username) {
  deleteConfirm = null;
  showUsersError('');
  var resp = await fetch('/api/users?username=' + encodeURIComponent(username), {method: 'DELETE'});
  if (resp.status === 401) { window.location.href = '/login'; return; }
  if (!resp.ok) { showUsersError('failed to delete user'); return; }
  refreshUsers();
}

var cachedUsers = null;
function renderUsersFromCache() {
  if (cachedUsers) renderUsers(cachedUsers);
}

async function savePort(username) {
  var el = document.getElementById('port-input-' + username);
  var val = el.value.trim();
  if (val === '') { showUsersError('port number required'); return; }
  var port = parseInt(val, 10);
  if (isNaN(port) || port < 0) { showUsersError('invalid port number'); return; }
  showUsersError('');
  var resp = await fetch('/api/users/port', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: username, port: port})
  });
  if (resp.status === 401) { window.location.href = '/login'; return; }
  if (!resp.ok) {
    var text = await resp.text();
    showUsersError(text || 'failed to update port');
    return;
  }
  editingUser = null;
  editingField = null;
  refreshUsers();
}

async function savePassword(username) {
  var el = document.getElementById('pw-input-' + username);
  var newPass = el.value;
  if (!newPass) { showUsersError('password required'); return; }
  showUsersError('');
  var resp = await fetch('/api/users/password', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: username, password: newPass})
  });
  if (resp.status === 401) { window.location.href = '/login'; return; }
  if (!resp.ok) { showUsersError('failed to change password'); return; }
  editingUser = null;
  editingField = null;
  refreshUsers();
}

async function saveDNS(username) {
  var proto = getDNSProto(username);
  var server = document.getElementById('dns-server-' + username).value.trim();

  if (proto && !server) { showUsersError('dns server required when protocol is set'); return; }

  showUsersError('');
  var resp = await fetch('/api/users/dns', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: username, dns_server: server, dns_protocol: proto})
  });
  if (resp.status === 401) { window.location.href = '/login'; return; }
  if (!resp.ok) { showUsersError('failed to update DNS config'); return; }
  delete dnsEditProto[username];
  editingUser = null;
  editingField = null;
  refreshUsers();
}

// --- Downtime Check (client-side, mirrors server logic) ---
function checkDowntimeClient(schedule) {
  if (!schedule || typeof schedule !== 'object') return false;
  var now = new Date();
  var nowMin = now.getHours() * 60 + now.getMinutes();
  var today = String(now.getDay());
  var yesterday = String((now.getDay() + 6) % 7);

  function parseMin(t) {
    var p = t.split(':');
    return parseInt(p[0]) * 60 + parseInt(p[1]);
  }

  // Check today's windows
  var todayWindows = schedule[today] || [];
  for (var i = 0; i < todayWindows.length; i++) {
    var s = parseMin(todayWindows[i].start), e = parseMin(todayWindows[i].end);
    if (s < e) { if (nowMin >= s && nowMin < e) return true; }
    else { if (nowMin >= s) return true; }
  }

  // Check yesterday's overnight spillover
  var yestWindows = schedule[yesterday] || [];
  for (var j = 0; j < yestWindows.length; j++) {
    var s2 = parseMin(yestWindows[j].start), e2 = parseMin(yestWindows[j].end);
    if (s2 >= e2 && nowMin < e2) return true;
  }

  return false;
}

// --- Downtime Schedule ---
var scheduleEdit = {}; // username -> working copy of schedule
var dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function getScheduleEdit(username, fromUser) {
  if (!scheduleEdit.hasOwnProperty(username)) {
    var sched = {};
    if (fromUser && fromUser.downtime_schedule) {
      for (var k in fromUser.downtime_schedule) {
        sched[k] = fromUser.downtime_schedule[k].map(function(w) {
          return {start: w.start, end: w.end};
        });
      }
    }
    scheduleEdit[username] = sched;
  }
  return scheduleEdit[username];
}

function renderScheduleEditRow(u) {
  var esc = escAttr(u.username);
  var sched = getScheduleEdit(u.username, u);
  var html = '<tr class="inline-edit-row">' +
    '<td colspan="6" class="inline-edit-cell">' +
      '<div class="inline-edit-form schedule-editor">' +
        '<div class="schedule-title">downtime schedule: ' + escHtml(u.username) + '</div>' +
        '<div class="schedule-grid">';

  for (var d = 0; d < 7; d++) {
    var dk = String(d);
    var windows = sched[dk] || [];
    html += '<div class="schedule-day">' +
      '<span class="schedule-day-label">' + dayNames[d] + '</span>' +
      '<span class="schedule-day-windows">';
    if (windows.length === 0) {
      html += '<span class="dim">no downtime</span>';
    } else {
      windows.forEach(function(w, wi) {
        var overnight = w.start > w.end || (w.start === w.end) ? ' <span class="dim">(overnight)</span>' : '';
        // Check if it's actually overnight by comparing parsed minutes
        var sMin = parseInt(w.start.split(':')[0]) * 60 + parseInt(w.start.split(':')[1]);
        var eMin = parseInt(w.end.split(':')[0]) * 60 + parseInt(w.end.split(':')[1]);
        overnight = sMin >= eMin && sMin !== eMin ? ' <span class="dim">(overnight)</span>' : '';
        html += '<span class="schedule-window">' +
          '<input type="time" class="inline-input inline-input-short" value="' + escAttr(w.start) + '"' +
            ' onchange="updateScheduleTime(\'' + esc + '\',' + d + ',' + wi + ',\'start\',this.value)">' +
          ' \u2013 ' +
          '<input type="time" class="inline-input inline-input-short" value="' + escAttr(w.end) + '"' +
            ' onchange="updateScheduleTime(\'' + esc + '\',' + d + ',' + wi + ',\'end\',this.value)">' +
          overnight +
          ' <button class="btn-sm btn-danger" onclick="removeScheduleWindow(\'' + esc + '\',' + d + ',' + wi + ')">\u00d7</button>' +
          '</span>';
      });
    }
    html += '</span>' +
      '<button class="btn-sm" onclick="addScheduleWindow(\'' + esc + '\',' + d + ')">+ add downtime</button>' +
      '</div>';
  }

  html += '</div>' +
    '<div class="schedule-actions">' +
      '<button class="btn-sm" onclick="copySundayToAll(\'' + esc + '\')">copy Sun \u2192 all days</button>' +
      '<span class="edit-actions">' +
        '<button class="btn-sm btn-save" onclick="saveSchedule(\'' + esc + '\')">save</button>' +
        '<button class="btn-sm" onclick="closeEdit()">cancel</button>' +
      '</span>' +
    '</div>' +
  '</div></td></tr>';
  return html;
}

function addScheduleWindow(username, day) {
  var sched = getScheduleEdit(username);
  var dk = String(day);
  if (!sched[dk]) sched[dk] = [];
  sched[dk].push({start: '22:00', end: '06:00'});
  renderUsersFromCache();
}

function removeScheduleWindow(username, day, idx) {
  var sched = getScheduleEdit(username);
  var dk = String(day);
  if (sched[dk]) {
    sched[dk].splice(idx, 1);
    if (sched[dk].length === 0) delete sched[dk];
  }
  renderUsersFromCache();
}

function updateScheduleTime(username, day, idx, field, value) {
  var sched = getScheduleEdit(username);
  var dk = String(day);
  if (sched[dk] && sched[dk][idx]) {
    sched[dk][idx][field] = value;
  }
}

function copySundayToAll(username) {
  var sched = getScheduleEdit(username);
  var sunWindows = sched['0'] || [];
  for (var d = 1; d <= 6; d++) {
    var dk = String(d);
    if (sunWindows.length > 0) {
      sched[dk] = sunWindows.map(function(w) { return {start: w.start, end: w.end}; });
    } else {
      delete sched[dk];
    }
  }
  renderUsersFromCache();
}

async function saveSchedule(username) {
  showUsersError('');
  var sched = getScheduleEdit(username);

  // Clean empty days
  var cleaned = {};
  for (var k in sched) {
    if (sched[k] && sched[k].length > 0) cleaned[k] = sched[k];
  }

  var resp = await fetch('/api/users/downtime', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: username, downtime_schedule: cleaned})
  });
  if (resp.status === 401) { window.location.href = '/login'; return; }
  if (!resp.ok) {
    var text = await resp.text();
    showUsersError(text || 'failed to update schedule');
    return;
  }
  delete scheduleEdit[username];
  editingUser = null;
  editingField = null;
  refreshUsers();
}

refreshUsers();

// --- Top Sites & Blocked ---
function renderList(id, items) {
  const el = document.getElementById(id);
  if (!items || items.length === 0) {
    el.innerHTML = '<li><span class="empty">no data</span></li>';
    return;
  }
  el.innerHTML = items.map(function(h, i) {
    return '<li><span class="rank">' + (i + 1) + '.</span><span class="host">' +
      escHtml(h.host) + '</span><span class="count">' + h.count + '</span></li>';
  }).join('');
}

async function refreshStats() {
  try {
    const [sites, blocked] = await Promise.all([
      fetch('/api/stats/top-sites').then(function(r) { return r.json(); }),
      fetch('/api/stats/top-blocked').then(function(r) { return r.json(); }),
    ]);
    renderList('top-sites', sites);
    renderList('top-blocked', blocked);
  } catch (e) { /* retry next cycle */ }
}

setInterval(refreshStats, 5000);
refreshStats();

// --- Traffic Graphs ---
function initCanvas(id) {
  var canvas = document.getElementById(id);
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx: ctx, w: rect.width, h: rect.height };
}

function drawTraffic(buckets) {
  var c = initCanvas('traffic-canvas');
  var ctx = c.ctx, w = c.w, h = c.h;
  var tc = getThemeColors();

  if (!buckets || buckets.length === 0) {
    ctx.fillStyle = tc.fgDim;
    ctx.font = '11px Inconsolata, Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('no data', w / 2, h / 2);
    return;
  }

  var maxIn = Math.max.apply(null, buckets.map(function(b) { return b.bw; })) || 1;
  var barW = w / buckets.length;
  var pad = 14;
  var bottom = h - 4;

  // Fill — bytes in from internet
  ctx.fillStyle = tc.graphFill;
  ctx.beginPath();
  ctx.moveTo(barW / 2, bottom);
  buckets.forEach(function(b, i) {
    var y = bottom - (b.bw / maxIn) * (bottom - pad);
    ctx.lineTo(i * barW + barW / 2, y);
  });
  ctx.lineTo((buckets.length - 1) * barW + barW / 2, bottom);
  ctx.fill();

  // Stroke
  ctx.strokeStyle = tc.graphStroke;
  ctx.lineWidth = 1;
  ctx.beginPath();
  buckets.forEach(function(b, i) {
    var y = bottom - (b.bw / maxIn) * (bottom - pad);
    var x = i * barW + barW / 2;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Label
  ctx.fillStyle = tc.fgDim;
  ctx.font = '10px Inconsolata';
  ctx.textAlign = 'left';
  ctx.fillText('⬇ in ' + fmtBytes(maxIn), 4, pad - 2);
}

function drawRequests(buckets) {
  var c = initCanvas('requests-canvas');
  var ctx = c.ctx, w = c.w, h = c.h;
  var tc = getThemeColors();

  if (!buckets || buckets.length === 0) {
    ctx.fillStyle = tc.fgDim;
    ctx.font = '11px Inconsolata, Courier New, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('no data', w / 2, h / 2);
    return;
  }

  var maxReqs = Math.max.apply(null, buckets.map(function(b) { return b.reqs; })) || 1;
  var barW = w / buckets.length;
  var pad = 14;

  // Fill
  ctx.fillStyle = tc.graphFill;
  ctx.beginPath();
  ctx.moveTo(barW / 2, h);
  buckets.forEach(function(b, i) {
    var y = h - pad - (b.reqs / maxReqs) * (h - 2 * pad);
    ctx.lineTo(i * barW + barW / 2, y);
  });
  ctx.lineTo((buckets.length - 1) * barW + barW / 2, h);
  ctx.fill();

  // Stroke
  ctx.strokeStyle = tc.graphStroke;
  ctx.lineWidth = 1;
  ctx.beginPath();
  buckets.forEach(function(b, i) {
    var y = h - pad - (b.reqs / maxReqs) * (h - 2 * pad);
    var x = i * barW + barW / 2;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Label
  ctx.fillStyle = tc.fgDim;
  ctx.font = '10px Inconsolata';
  ctx.textAlign = 'right';
  ctx.fillText(maxReqs, w - 4, pad - 2);
}

function drawGraphs(buckets) {
  drawTraffic(buckets);
  drawRequests(buckets);
}

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(1) + ' GB';
}

async function refreshTraffic() {
  try {
    var data = await fetch('/api/stats/traffic').then(function(r) { return r.json(); });
    drawGraphs(data);
  } catch (e) { /* retry next cycle */ }
}

setInterval(refreshTraffic, 10000);
document.fonts.ready.then(refreshTraffic);
refreshTraffic();

// --- Log Tail (SSE) ---
function startLogTail() {
  var logEl = document.getElementById('log-tail');
  var es = new EventSource('/api/logs');

  es.onmessage = function(ev) {
    var e = JSON.parse(ev.data);
    var d = e.ts ? new Date(e.ts) : null;
    var ts = d ? d.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',second:'2-digit',fractionalSecondDigits:3}) : '';
    var user = (e.user || '-').padEnd(12);
    var event = (e.event || '-').padEnd(9);
    var method = (e.method || '').padEnd(7);
    var host = (e.host || '').substring(0, 35).padEnd(35);
    var status = String(e.status || 0);
    var bytes = (e.bytes_read || 0) + '/' + (e.bytes_written || 0);

    var line = ts + '  ' + user + '  ' + event + '  ' + method + '  ' + host + '  ' + status + '  ' + bytes;
    if (e.error) line += '  err=' + e.error;

    var span = document.createElement('span');
    if (e.event === 'dns-block' || e.event === 'dns-err') span.className = 'log-block';
    else if (e.status >= 400) span.className = 'log-err';
    else span.className = 'log-ok';
    span.textContent = line + '\n';
    logEl.appendChild(span);

    while (logEl.childNodes.length > 200) {
      logEl.removeChild(logEl.firstChild);
    }

    var atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
    if (atBottom) logEl.scrollTop = logEl.scrollHeight;
  };
}

startLogTail();

// --- Util ---
function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function escAttr(s) {
  return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// --- Version ---
fetch('/api/version').then(function(r) { return r.json(); }).then(function(d) {
  document.getElementById('version-link').textContent = 'evan-proxy ' + d.version;
});
