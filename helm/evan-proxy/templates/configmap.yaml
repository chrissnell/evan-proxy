apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "evan-proxy.fullname" . }}
  labels:
    {{- include "evan-proxy.labels" . | nindent 4 }}
data:
  ADMIN_LISTEN: {{ .Values.admin.listen | quote }}
  # Admin login brute-force protection
  ADMIN_LOGIN_RATE_LIMIT: {{ .Values.admin.loginRateLimit | quote }}
  ADMIN_LOGIN_WINDOW: {{ .Values.admin.loginWindow | quote }}
  ADMIN_LOGIN_GLOBAL_MAX: {{ .Values.admin.loginGlobalMax | quote }}
  {{- if .Values.admin.trustedProxyCIDRs }}
  TRUSTED_PROXY_CIDRS: {{ join "," .Values.admin.trustedProxyCIDRs | quote }}
  {{- end }}
  # Metrics — internal listener, never on the public admin port
  METRICS_LISTEN: {{ .Values.metrics.listen | quote }}
  METRICS_USER_LABEL: {{ .Values.metrics.userLabel | default false | quote }}
  # TLS in front (ingress/LB) → Secure session cookie + HSTS
  FORCE_HTTPS: {{ .Values.admin.forceHTTPS | default false | quote }}
  # Console logging
  LOG_FORMAT: {{ .Values.logging.console.format | quote }}
  # Verbose per-request header logging (plain-HTTP forward path only)
  LOG_HEADERS: {{ .Values.logging.headers | default false | quote }}
  # Network logging (independent of console)
  {{- if .Values.logging.net.mode }}
  LOG_NET_MODE: {{ .Values.logging.net.mode | quote }}
  LOG_NET_ADDR: {{ .Values.logging.net.address | quote }}
  {{- if eq .Values.logging.net.mode "json-http" }}
  LOG_NET_BATCH_SIZE: {{ .Values.logging.net.batchSize | quote }}
  LOG_NET_FLUSH_INTERVAL: {{ .Values.logging.net.flushInterval | quote }}
  {{- end }}
  {{- end }}
  IDLE_TIMEOUT: {{ .Values.proxy.idleTimeout | quote }}
  HTTP_TIMEOUT: {{ .Values.proxy.httpTimeout | quote }}
  CONNECT_DIAL_TIMEOUT: {{ .Values.proxy.connectDialTimeout | quote }}
  AUTH_RETRY_TIMEOUT: {{ .Values.proxy.authRetryTimeout | quote }}
  AUTH_FAIL_RATE_LIMIT: {{ .Values.proxy.authFailRateLimit | quote }}
  AUTH_FAIL_WINDOW: {{ .Values.proxy.authFailWindow | quote }}
  {{- if .Values.proxy.dnsServer }}
  DNS_SERVER: {{ .Values.proxy.dnsServer | quote }}
  {{- end }}
  {{- if .Values.proxy.dnsProtocol }}
  DNS_PROTOCOL: {{ .Values.proxy.dnsProtocol | quote }}
  {{- end }}
  USER_PORT_MIN: {{ .Values.proxy.userPortMin | quote }}
  USER_PORT_MAX: {{ .Values.proxy.userPortMax | quote }}
  {{- if .Values.pac.enabled }}
  # PAC endpoint — served on the proxy port at PAC_PATH; contains no credentials
  PAC_ENABLED: "true"
  {{- if .Values.pac.path }}
  PAC_PATH: {{ .Values.pac.path | quote }}
  {{- end }}
  {{- if .Values.pac.proxyEndpoint }}
  PAC_PROXY_ENDPOINT: {{ .Values.pac.proxyEndpoint | quote }}
  {{- end }}
  {{- if .Values.pac.bypassDomains }}
  PAC_BYPASS_DOMAINS: {{ join "," .Values.pac.bypassDomains | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.debug.pprofEnabled }}
  # pprof profiling — bound to a loopback listener only, never the admin port
  PPROF_ENABLED: "true"
  PPROF_LISTEN: {{ .Values.debug.pprofListen | quote }}
  {{- end }}
  {{- if .Values.demoMode }}
  # Demo / no-op mode — full API, but no real per-user proxy listeners bind.
  # App Store validation only; not for real deployments.
  DEMO_MODE: "true"
  {{- end }}
  {{- if .Values.timezone }}
  TZ: {{ .Values.timezone | quote }}
  {{- end }}
