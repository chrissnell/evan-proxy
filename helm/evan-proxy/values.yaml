replicaCount: 1

image:
  repository: ghcr.io/chrissnell/evan-proxy
  tag: "0.1.5"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-secret

# Logging — console and network are independent, both can run simultaneously
logging:
  # Console output (stdout) — always active
  console:
    format: "human"    # "human" or "json"
  # Verbose per-request header logging on the plain-HTTP forward path.
  # Diagnostic only — noisy; credentials are redacted. HTTPS (CONNECT) is an
  # opaque tunnel and its headers are never logged.
  headers: false
  # Network logging — optional, runs alongside console
  net:
    mode: ""             # "json-udp" or "json-http", empty = disabled
    address: ""          # UDP: "host:port", HTTP: "http://host:port/path"
    batchSize: 100       # json-http only: max entries before flush
    flushInterval: "5s"  # json-http only: max time between flushes

# Proxy configuration
proxy:
  idleTimeout: "300s"
  httpTimeout: "30s"
  connectDialTimeout: "10s"
  authRetryTimeout: "5s"
  authFailRateLimit: 5
  authFailWindow: "60s"
  dnsServer: ""    # e.g. "1.1.1.1:53", empty = system default
  dnsProtocol: ""  # "plain", "tls", or "https" — empty = plain
  userPortMin: 8080  # start of per-user dedicated port range
  userPortMax: 8090  # end of per-user dedicated port range (11 ports)

# PAC (proxy auto-config) — optional.
# When enabled, the proxy answers an unauthenticated GET at `path` on each proxy
# port with a PAC file, so specific domains can bypass the proxy (routed DIRECT)
# via an iOS "Auto" Global HTTP Proxy. Because it is served on the proxy port
# itself, the PAC URL is the same endpoint the device already uses:
#   http://<proxy-host>:<proxy-port><path>
# The PAC contains only routing rules — never any credentials.
pac:
  enabled: false
  path: "/proxy.pac"
  # Proxy "host:port" the PAC hands back. Empty = echo the request's own Host
  # (the exact endpoint the device used to fetch the PAC), which is correct for
  # NAT/port-forward setups and needs no per-user configuration.
  proxyEndpoint: ""
  # Domain suffixes routed DIRECT. Empty = built-in default
  # (venmo.com, paypal.com, paypalobjects.com, braintreegateway.com, braintree-api.com).
  bypassDomains: []

# Debug endpoints — opt-in pprof profiling.
# Never served on the public admin port. When enabled, pprof binds a separate
# loopback listener (`pprofListen`), reachable only from inside the pod via
# `kubectl port-forward`. Leave disabled in normal operation.
debug:
  pprofEnabled: false
  pprofListen: "127.0.0.1:6060"

# Persistent storage for SQLite user database
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""  # empty = default StorageClass

# Prometheus metrics — served on a dedicated internal listener, never on the
# public admin LoadBalancer. Inside the pod it binds 0.0.0.0 so an in-cluster
# scraper can reach it, but it is exposed only through an internal ClusterIP
# Service guarded by a NetworkPolicy limited to the monitoring namespace.
metrics:
  # Listen address inside the pod. Bind 0.0.0.0 so the ClusterIP Service can
  # reach it; NetworkPolicy restricts who may actually connect.
  listen: "0.0.0.0:9091"
  # Include the per-user label on request metrics. This is PII (the children's
  # usernames) — keep false unless you accept exposing usernames to Prometheus.
  userLabel: false
  # Port the internal metrics ClusterIP Service listens on.
  port: 9091
  # Kubernetes namespace running Prometheus; the NetworkPolicy allows metrics
  # scrapes only from pods in this namespace.
  scrapeNamespace: "monitoring"

# Admin interface
admin:
  listen: ":9090"
  user: "admin"
  # bcrypt hash of admin password
  # generate with: htpasswd -nbBC 10 "" 'yourpassword' | cut -d: -f2
  passwordHash: "$2y$10$CHANGEME"
  # Login brute-force protection for /api/login. Only failed attempts count, so
  # a device that keeps logging in successfully (iOS reauth) never trips it.
  loginRateLimit: 5      # per-IP failures allowed within loginWindow
  loginWindow: "15m"     # sliding window for per-IP and global failures
  loginGlobalMax: 100    # global failure ceiling across all IPs (0 = disabled)
  # CIDRs whose X-Forwarded-For header is trusted (your ingress/LB). When empty,
  # XFF is ignored and the immediate peer address is used — safe default that
  # prevents header-spoofed rate-limit evasion.
  trustedProxyCIDRs: []
  # Set true when TLS terminates in front of the pod (ingress below, or an
  # external LB). Sets the Secure flag on the session cookie and sends HSTS.
  # Leave false only for plain-HTTP local access. Apple ATS (the iOS app)
  # requires HTTPS, so any remote deployment must set this true.
  forceHTTPS: false

# Use an existing secret instead of creating one
# Secret must contain: ADMIN_USER, ADMIN_PASSWORD
existingSecret: ""

# Service
service:
  type: LoadBalancer
  # Set a specific IP from the MetalLB pool, or leave empty for auto-assign
  loadBalancerIP: ""
  annotations: {}
  adminPort: 9090
  # Expose the admin port (9090) on this Service. The per-user proxy ports are
  # always exposed (they are the product). For any internet-facing deployment,
  # set this false and reach the admin UI through the TLS ingress below (or a
  # private LB) instead of exposing plaintext admin on the public LoadBalancer.
  exposeAdmin: true

# Resources
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Network policy (requires a CNI that supports NetworkPolicy)
networkPolicy:
  enabled: true
  # Allow CONNECT tunnels to reach any port (not just 80/443)
  allowAllEgress: true

# Ingress for the admin UI. When enabled, a dedicated ClusterIP service
# (<release>-admin) is created as the ingress backend, so the admin port need
# not be exposed on the public LoadBalancer (set service.exposeAdmin: false).
# Terminate TLS here and set admin.forceHTTPS: true.
ingress:
  enabled: false
  className: ""
  # cert-manager issues and renews the TLS cert automatically. Example:
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: proxy.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
          servicePort: 9090
  # TLS termination at the ingress. cert-manager fills secretName from the
  # annotation above; or supply a pre-created secret. Example:
  tls: []
    # - secretName: evan-proxy-tls
    #   hosts:
    #     - proxy.example.com

# Timezone for downtime schedule evaluation (IANA format)
# e.g. "America/Denver", "America/Los_Angeles", "US/Eastern"
timezone: "America/Denver"

nodeSelector: {}
tolerations: []
affinity: {}
