name: EvanProxyApp
options:
  bundleIdPrefix: com.chrissnell
  deploymentTarget:
    iOS: "17.0"
  # Stamp what this generation was built from, so builds can detect a stale
  # generated project (Generated/ is gitignored — see the guard script below).
  postGenCommand: shasum -a 256 project.yml > Generated/project.yml.sha256
packages:
  EvanProxy:
    path: ..
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.6.0
  swift-http-types:
    url: https://github.com/apple/swift-http-types
    from: 1.0.0
targets:
  EvanProxyApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: EvanProxy
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: evan-proxy
        UILaunchScreen: {}
        # No encryption beyond what Apple exempts (HTTPS/TLS only), so App Store
        # Connect never prompts for export-compliance docs on upload.
        ITSAppUsesNonExemptEncryption: false
        # Home-LAN admin app: the server is typically plain http on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: >-
          The camera scans the pairing QR code shown in the evan-proxy admin
          "devices" panel.
        CFBundleURLTypes:
          - CFBundleURLName: com.evanproxy.pair
            CFBundleURLSchemes: [evanproxy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrissnell.evan-proxy
        # Apple Developer team (shared with RemoteWeather.app). Automatic signing
        # uses this to pick the distribution cert + provisioning profile.
        DEVELOPMENT_TEAM: 52CRC9LE38
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Public version (CFBundleShortVersionString) and build number
        # (CFBundleVersion). The build number must strictly increase on every
        # App Store upload; bump CURRENT_PROJECT_VERSION for each new build.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
    preBuildScripts:
      # Generated/Info.plist is gitignored, so pulling a project.yml change
      # without re-running xcodegen silently ships a stale plist (this once
      # dropped NSCameraUsageDescription and crashed the scanner). Fail the
      # build loudly instead.
      - name: Guard against stale generated project
        shell: /bin/bash
        script: |
          cd "${PROJECT_DIR}"
          if ! shasum -a 256 --status -c Generated/project.yml.sha256 2>/dev/null; then
            echo "error: project.yml changed since this Xcode project was generated — run 'xcodegen generate' in ios/App" >&2
            exit 1
          fi
        basedOnDependencyAnalysis: false
  EvanProxyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/EvanProxyTests
    dependencies:
      - target: EvanProxyApp
      - package: EvanProxy
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  EvanProxyApp:
    build:
      targets:
        EvanProxyApp: all
        EvanProxyAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [EvanProxyAppTests]
